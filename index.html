<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Blog - Física</title>
    <style>
        body { font-family: sans-serif; max-width: 1100px; margin: 0 auto; padding: 20px; background: #f4f6f9; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 30px; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
        input, textarea { width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #1e293b; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #334155; }
        .post-item { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #1e293b; }
        .post-item h3 { margin: 0; }
        .post-item p { margin: 5px 0; }
        .post-item small { color: #999; display: block; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header><h1>📝 Mi Blog - Física</h1></header>
        <div class="grid">
            <div>
                <h2>Crear Usuario</h2>
                <div class="card">
                    <input type="text" id="nombre" placeholder="Nombre">
                    <input type="email" id="correo" placeholder="Correo">
                    <input type="password" id="contrasena" placeholder="Contraseña">
                    <input type="text" id="rol" placeholder="Rol (ej: admin)">
                    <button onclick="crearUsuario()">Crear Usuario</button>
                </div>
                <h2>Crear Publicación</h2>
                <div class="card">
                    <input type="text" id="titulo" placeholder="Título">
                    <textarea id="contenido" rows="4" placeholder="Contenido"></textarea>
                    <input type="number" id="id_usuario" placeholder="ID Usuario">
                    <button onclick="crearPublicacion()">Publicar</button>
                </div>
            </div>
            <div>
                <h2>📰 Publicaciones</h2>
                <div id="contenedor-publicaciones"><p style="color:#999;">Cargando...</p></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        async function crearUsuario() {
            const data = {
                nombre: document.getElementById('nombre').value,
                correo: document.getElementById('correo').value,
                contrasena: document.getElementById('contrasena').value,
                rol: document.getElementById('rol').value
            };
            try {
                const res = await fetch(`${API_URL}/usuarios`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if(json.mensaje) {
                    alert('✅ '+json.mensaje+' (ID: '+json.id+')');
                } else {
                    alert('❌ Error: '+json.error);
                }
            } catch(e) {
                alert('❌ Error de red: '+e.message);
            }
        }

        async function crearPublicacion() {
            const data = {
                titulo: document.getElementById('titulo').value,
                contenido: document.getElementById('contenido').value,
                id_usuario: parseInt(document.getElementById('id_usuario').value)
            };
            try {
                const res = await fetch(`${API_URL}/publicaciones`, {
                    method: 'POST', headers: {'Content-Type':'application/json'},
                    body: JSON.stringify(data)
                });
                const json = await res.json();
                if(json.mensaje) {
                    alert('✅ '+json.mensaje+' (ID: '+json.id+')');
                    cargarPublicaciones();
                } else {
                    alert('❌ Error: '+json.error);
                }
            } catch(e) {
                alert('❌ Error de red: '+e.message);
            }
        }

        async function cargarPublicaciones() {
            const contenedor = document.getElementById('contenedor-publicaciones');
            contenedor.innerHTML = '<p style="color:#999;">Cargando...</p>';
            try {
                const res = await fetch(`${API_URL}/publicaciones`);
                if(!res.ok) throw new Error(`HTTP ${res.status}`);
                const pubs = await res.json();
                
                contenedor.innerHTML = '';
                if(pubs.length === 0) {
                    contenedor.innerHTML = '<p style="color:#999;">No hay publicaciones aún. ¡Crea una!</p>';
                    return;
                }
                pubs.forEach(p => {
                    const div = document.createElement('div');
                    div.className = 'post-item';
                    div.innerHTML = `<h3>${p.titulo}</h3><p>${p.contenido}</p><small>✍️ ${p.autor}</small>`;
                    contenedor.appendChild(div);
                });
            } catch(e) {
                console.error("❌ Error:", e);
                contenedor.innerHTML = `<p style="color:red;">Error al cargar: ${e.message}</p>`;
            }
        }
        document.addEventListener('DOMContentLoaded', cargarPublicaciones);
    </script>
</body>
</html>
